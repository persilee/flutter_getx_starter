name: flutter_getx_starter
description: 'A new Flutter project.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  get: 4.7.3

  # 本地存储
  shared_preferences: ^2.5.6
  # 主题管理
  adaptive_theme: 3.7.2
  # 路由管理
  go_router: 18.0.2
  # JSON 序列化注解
  freezed_annotation: 3.1.0
  # 网络请求
  dio: 5.11.1
  # iOS / macOS 使用系统网络栈；其他平台在本节保留 Dio 默认适配器
  native_dio_adapter: 1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  # 代码生成
  build_runner: 2.16.2
  # JSON 转模型
  freezed: 4.0.2

flutter:
  uses-material-design: true
